version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      weekly-batch:
        patterns:
          - '*'
    ignore:
      # eslint-plugin-jsx-a11y@6.10.2 (latest) caps its eslint peer dep at
      # ^9, so an eslint major bump breaks npm ci with ERESOLVE.
      # @eslint/js must stay in lockstep with eslint (it requires eslint
      # ^10 once bumped), so it's ignored too - otherwise dependabot bumps
      # them independently and breaks the peer resolution the other way.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript-eslint@8.68.0 caps its typescript peer dep at <6.1.0,
      # so a typescript major bump breaks npm ci with ERESOLVE (same
      # constraint already worked around in angular_estado).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
