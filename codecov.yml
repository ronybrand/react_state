# Gate de cobertura, bloqueando PRs. Alvo de 90% (com folga de 2% contra
# flutuações pequenas) e 80% para o código novo de cada PR, evitando
# travar em diffs triviais.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 80%

comment:
  layout: 'reach, diff, flags, files'
