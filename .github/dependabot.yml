version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # More specific than weekly-batch below (dependabot prefers the more
      # specific group), so vitest and @vitest/coverage-v8 always bump
      # together - they're peer-dependency-locked to the same major, and PR
      # #58 (a standalone, non-batched PR for just `vitest`) bumped only one
      # of them, breaking `npm ci` with an ERESOLVE conflict.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      weekly-batch:
        patterns:
          - '*'
    ignore:
      # typescript-eslint (bundled by eslint-config-next) doesn't support
      # TS majors as soon as they ship - PR #57 bumped to 7.0.2 and `npm run
      # lint` failed outright with "typescript-eslint does not support TS
      # 7.0.". Re-evaluate once eslint-config-next's typescript-eslint dep
      # catches up.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
