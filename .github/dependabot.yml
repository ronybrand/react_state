version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      weekly-batch:
        patterns:
          - '*'
    ignore:
      # eslint-plugin-jsx-a11y@6.10.2 (latest) caps its eslint peer dep at
      # ^9, so an eslint major bump breaks npm ci with ERESOLVE.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
