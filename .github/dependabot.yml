version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      weekly-batch:
        patterns:
          - '*'
    # No ignore rules for now: the Next.js migration dropped
    # eslint-plugin-jsx-a11y, @eslint/js, typescript-eslint and
    # eslint-plugin-react-hooks as direct dependencies (eslint-config-next
    # bundles its own equivalents), which is what the previous ignore rules
    # here were about - see git history (pre-migration) for the original
    # reasoning if any of those peer-dependency constraints resurface
    # through eslint-config-next itself.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - '*'
